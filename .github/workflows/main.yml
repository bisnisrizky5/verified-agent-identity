jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install ClawHub
        run: npm install -g @clawhub/cli

      - name: Install dependencies
        run: |
          mkdir -p scripts
