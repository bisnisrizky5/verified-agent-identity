name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Agent Username'
        required: true
        default: 'iky_rz'
      agent_description:
        description: 'Agent Description'
        required: true
        default: 'AI Agent iky_rz'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Step 1 - Install ClawHub
        run: npm install -g @clawhub/cli

      - name: Step 2 - Install dependencies
        run: |
          cd scripts
          npm install

      - name: Step 3 - Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 4 - Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "${{ github.event.inputs.agent_name }}", "description": "${{ github.event.inputs.agent_description }}"}'
